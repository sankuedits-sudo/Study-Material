<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dora Dora - EdTech Learning App</title>
    
    <!-- Firebase SDK Scripts -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background-color: #0f0f0f;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .phone-container {
            width: 100%;
            max-width: 412px;
            height: 100vh;
            max-height: 860px;
            background-color: #0f0f0f;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 0 30px rgba(0,0,0,0.9);
            border-radius: 40px;
        }

        .phone-container::-webkit-scrollbar {
            display: none;
        }

        .screen {
            display: none;
            flex-direction: column;
            min-height: 100%;
        }

        .screen.active {
            display: flex;
        }

        /* LOGIN SCREEN */
        .login-screen {
            justify-content: center;
            align-items: center;
            padding: 30px;
            text-align: center;
            background: linear-gradient(135deg, #0f0f0f 0%, #212121 100%);
        }

        .login-logo {
            font-size: 32px;
            font-weight: bold;
            color: #ff0000;
            font-family: serif;
            letter-spacing: 3px;
            margin-bottom: 8px;
        }

        .login-subtitle {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 30px;
        }

        .input-group {
            width: 100%;
            margin-bottom: 12px;
            text-align: left;
        }

        .input-group label {
            font-size: 11px;
            color: #aaa;
            margin-bottom: 4px;
            display: block;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            background: #222;
            border: 1px solid #444;
            color: #fff;
            border-radius: 6px;
            font-size: 12px;
        }

        .btn-full {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            border: none;
            cursor: pointer;
            background: #ff0000;
            color: #fff;
            margin-top: 10px;
        }

        /* SEARCH BAR */
        .search-box {
            padding: 10px 15px;
            background: #0f0f0f;
            position: sticky;
            top: 57px;
            z-index: 9;
        }

        .search-input {
            width: 100%;
            padding: 10px 15px;
            background: #181818;
            border: 1px solid #333;
            color: #fff;
            border-radius: 20px;
            font-size: 12px;
            outline: none;
        }

        /* HEADERS & NAVIGATION */
        .home-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: #0f0f0f;
            border-bottom: 1px solid #222;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .home-logo {
            font-size: 18px;
            font-weight: bold;
            color: #ff0000;
            letter-spacing: 1px;
        }

        .icon-btn {
            background: #222;
            border: none;
            color: #fff;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
        }

        .feed-container {
            padding: 15px;
        }

        .section-title {
            font-size: 14px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 12px;
        }

        /* COURSE CARD WITH FAVOURITE HEART */
        .course-grid-card {
            background: #181818;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 16px;
            position: relative;
            border: 1px solid #222;
        }

        .course-thumb-container {
            position: relative;
            width: 100%;
            height: 160px;
            cursor: pointer;
        }

        .course-grid-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .fav-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.6);
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            cursor: pointer;
            z-index: 5;
        }

        .course-grid-info {
            padding: 12px;
            cursor: pointer;
        }

        .course-grid-title {
            font-size: 15px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 3px;
        }

        .course-grid-desc {
            font-size: 11px;
            color: #aaa;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* SUBJECT & LECTURE CARD */
        .subject-card {
            background: #181818;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #333;
            cursor: pointer;
        }

        .yt-card {
            background: #181818;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 20px;
            cursor: pointer;
            position: relative;
        }

        .yt-thumb-box {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
        }

        .yt-thumb {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .yt-duration {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .yt-details {
            padding: 12px;
        }

        .yt-meta h3 {
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 4px;
            line-height: 1.3;
        }

        .yt-meta p {
            font-size: 11px;
            color: #aaa;
            line-height: 1.2;
        }

        .back-nav-bar {
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #0f0f0f;
            position: sticky;
            top: 0;
            z-index: 10;
            border-bottom: 1px solid #222;
        }

        .back-btn {
            background: #222;
            border: none;
            color: #fff;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            cursor: pointer;
        }

        /* VIDEO PLAYER MODAL */
        .video-modal {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000;
            z-index: 1000;
            display: none;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }
        .video-modal.active { display: flex; }
        
        .video-wrapper {
            position: relative;
            width: 100%;
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }

        .video-modal video {
            width: 100%;
            height: 100%;
            max-height: 100vh;
            background: #000;
            border: none;
            object-fit: contain;
        }

        .player-bottom-bar {
            width: 100%;
            padding: 12px 20px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            background: #111;
            z-index: 1100;
        }
    </style>
</head>
<body>

    <div class="phone-container">

        <!-- LOGIN SCREEN -->
        <div id="loginScreen" class="screen login-screen">
            <div class="login-logo">DORA DORA</div>
            <div class="login-subtitle">EdTech Learning Portal</div>
            
            <div class="input-group">
                <label>Mobile Number</label>
                <input type="text" id="loginUser" placeholder="Enter mobile number">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="loginPass" placeholder="••••••••">
            </div>

            <button class="btn-full" onclick="handleLogin()">Sign In</button>
        </div>

        <!-- USER HOME SCREEN (COURSES) -->
        <div id="homeScreen" class="screen">
            <div class="home-header">
                <div class="home-logo">DORA DORA</div>
                <button class="icon-btn" onclick="handleLogout()">Logout</button>
            </div>
            <div class="search-box">
                <input type="text" class="search-input" placeholder="🔍 Search courses..." oninput="filterCourses(this.value)">
            </div>
            <div class="feed-container">
                <div class="section-title">My Favourites ⭐</div>
                <div id="favCoursesContainer" style="margin-bottom: 20px;"></div>

                <div class="section-title">Available Courses</div>
                <div id="coursesGridContainer"></div>
            </div>
        </div>

        <!-- SUBJECT LIST SCREEN -->
        <div id="subjectScreen" class="screen" style="position: relative;">
            <div class="back-nav-bar">
                <button class="back-btn" onclick="switchScreen('homeScreen')">‹ Courses</button>
                <span id="navCourseTitleHeader" style="font-size:12px; font-weight:bold; color:#fff;">COURSE</span>
                <div style="width:40px;"></div>
            </div>
            <div class="feed-container">
                <div class="section-title">Subjects & Study Material</div>
                <div id="subjectsContainer"></div>
            </div>
        </div>

        <!-- LECTURES & NOTES SCREEN -->
        <div id="lectureScreen" class="screen" style="position: relative;">
            <div class="back-nav-bar">
                <button class="back-btn" onclick="openSubjectList()">‹ Subjects</button>
                <span id="navSubjectTitleHeader" style="font-size:12px; font-weight:bold; color:#fff;">SUBJECT</span>
                <div style="width:40px;"></div>
            </div>
            <div class="feed-container">
                <div id="classNotesSection" style="margin-bottom: 15px;"></div>
                <div class="section-title">Video Lectures</div>
                <div id="lecturesContainer"></div>
            </div>
        </div>

    </div>

    <!-- VIDEO PLAYER MODAL -->
    <div class="video-modal" id="videoModal" oncontextmenu="return false;">
        <div class="video-wrapper" id="playerContainer"></div>
        <div class="player-bottom-bar">
            <button class="back-btn" onclick="closePlayer()">Close ✕</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            databaseURL: "https://dora-dora-2e0e6-default-rtdb.asia-southeast1.firebasedatabase.app"
        };

        firebase.initializeApp(firebaseConfig);
        const rtdb = firebase.database();

        let coursesData = {};
        let currentUser = localStorage.getItem('doradoraUser') || null;
        let favourites = JSON.parse(localStorage.getItem('doradoraFavs')) || [];
        let activeCourseKey = null;
        let activeSubjectName = null;

        window.onload = function() {
            rtdb.ref('courses').on('value', (snapshot) => {
                coursesData = snapshot.val() || {};
                if (currentUser) renderUserCourses();
            });

            if (currentUser) {
                switchScreen('homeScreen');
                renderUserCourses();
            } else {
                switchScreen('loginScreen');
            }

            window.addEventListener('popstate', function() {
                if (document.getElementById('videoModal').classList.contains('active')) {
                    closePlayer();
                }
            });
        };

        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function handleLogin() {
            const user = document.getElementById('loginUser').value.trim();
            const pass = document.getElementById('loginPass').value.trim();
            if (!user || !pass) { alert('Enter credentials'); return; }
            currentUser = user;
            localStorage.setItem('doradoraUser', currentUser);
            renderUserCourses();
            switchScreen('homeScreen');
        }

        function handleLogout() {
            currentUser = null;
            localStorage.removeItem('doradoraUser');
            switchScreen('loginScreen');
        }

        function toggleFavourite(courseKey, event) {
            event.stopPropagation();
            if (favourites.includes(courseKey)) {
                favourites = favourites.filter(k => k !== courseKey);
            } else {
                favourites.push(courseKey);
            }
            localStorage.setItem('doradoraFavs', JSON.stringify(favourites));
            renderUserCourses();
        }

        function renderUserCourses(filterQuery = '') {
            const container = document.getElementById('coursesGridContainer');
            const favContainer = document.getElementById('favCoursesContainer');
            container.innerHTML = '';
            favContainer.innerHTML = '';

            const keys = Object.keys(coursesData);
            if(keys.length === 0) {
                container.innerHTML = '<p style="color:#777; font-size:12px;">No courses available.</p>';
                favContainer.innerHTML = '<p style="color:#777; font-size:12px;">No favourite courses.</p>';
                return;
            }

            let favCount = 0;
            keys.forEach(key => {
                const course = coursesData[key];
                if (filterQuery && !course.name.toLowerCase().includes(filterQuery.toLowerCase())) return;

                const isFav = favourites.includes(key);
                const favHeart = isFav ? '❤️' : '🤍';

                const cardHtml = `
                    <div class="course-grid-card">
                        <button class="fav-btn" onclick="toggleFavourite('${key}', event)">${favHeart}</button>
                        <div class="course-thumb-container" onclick="openCourseSubjects('${key}')">
                            <img src="${course.heroImg}" class="course-grid-img" alt="${course.name}">
                        </div>
                        <div class="course-grid-info" onclick="openCourseSubjects('${key}')">
                            <div class="course-grid-title">${course.name}</div>
                            <div class="course-grid-desc">${course.desc}</div>
                        </div>
                    </div>
                `;

                if (isFav) {
                    favCount++;
                    favContainer.innerHTML += cardHtml;
                }
                container.innerHTML += cardHtml;
            });

            if (favCount === 0) {
                favContainer.innerHTML = '<p style="color:#777; font-size:12px;">Click the heart (🤍) on any course to add to favourites.</p>';
            }
        }

        function filterCourses(query) {
            renderUserCourses(query);
        }

        function openCourseSubjects(courseKey) {
            activeCourseKey = courseKey;
            const course = coursesData[courseKey];
            document.getElementById('navCourseTitleHeader').innerText = course.name;
            const container = document.getElementById('subjectsContainer');
            container.innerHTML = '';

            const subjects = course.subjects || {};
            const subNames = Object.keys(subjects);

            if(subNames.length === 0) {
                container.innerHTML = '<p style="color:#777; font-size:12px;">No subjects added in this course yet.</p>';
            } else {
                subNames.forEach(sub => {
                    container.innerHTML += `
                        <div class="subject-card" onclick="openLectures('${sub}')">
                            <span>📚 <b>${sub}</b></span>
                            <span style="color:#aaa;">View Lectures ›</span>
                        </div>
                    `;
                });
            }
            switchScreen('subjectScreen');
        }

        function openSubjectList() {
            if(activeCourseKey) openCourseSubjects(activeCourseKey);
        }

        function openLectures(subName) {
            activeSubjectName = subName;
            document.getElementById('navSubjectTitleHeader').innerText = subName;
            const notesContainer = document.getElementById('classNotesSection');
            const lecContainer = document.getElementById('lecturesContainer');
            notesContainer.innerHTML = '';
            lecContainer.innerHTML = '';

            const subData = coursesData[activeCourseKey].subjects[subName] || {};
            const lectures = subData.lectures || [];
            const notesLink = subData.notesLink || '';

            if(notesLink) {
                notesContainer.innerHTML = `
                    <div style="background:#1a233a; padding:12px; border-radius:10px; display:flex; justify-content:space-between; align-items:center; border:1px solid #336699;">
                        <span>📄 <b>Daily Class Notes & PDFs</b></span>
                        <a href="${notesLink}" target="_blank" style="background:#ff0000; color:#fff; padding:6px 12px; border-radius:6px; font-size:11px; text-decoration:none; font-weight:bold;">Download Notes</a>
                    </div>
                `;
            }

            if(lectures.length === 0) {
                lecContainer.innerHTML = '<p style="color:#777; font-size:12px;">No lectures available in this subject.</p>';
            } else {
                lectures.forEach((lec, idx) => {
                    lecContainer.innerHTML += `
                        <div class="yt-card" onclick="openPlayerModal(${idx})">
                            <div class="yt-thumb-box">
                                <img src="${lec.thumb || coursesData[activeCourseKey].heroImg}" class="yt-thumb" alt="thumb">
                                <div class="yt-duration">${lec.duration}</div>
                            </div>
                            <div class="yt-details">
                                <div class="yt-meta">
                                    <h3>${lec.title}</h3>
                                    <p>${lec.desc}</p>
                                </div>
                            </div>
                        </div>
                    `;
                });
            }
            switchScreen('lectureScreen');
        }

        function openPlayerModal(lecIdx) {
            const lec = coursesData[activeCourseKey].subjects[activeSubjectName].lectures[lecIdx];
            const container = document.getElementById('playerContainer');
            container.innerHTML = '';

            const video = document.createElement('video');
            video.controls = true;
            video.autoplay = true;
            video.playsInline = true;
            video.disablePictureInPicture = true;
            video.setAttribute('controlsList', 'nodownload noremoteplayback');
            video.src = lec.videoUrl;

            container.appendChild(video);

            history.pushState({ playerOpen: true }, "");
            document.getElementById('videoModal').classList.add('active');
        }

        function closePlayer() {
            document.getElementById('playerContainer').innerHTML = '';
            document.getElementById('videoModal').classList.remove('active');
            if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
        }
    </script>
</body>
</html>
