     <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dora Dora - Video Streamer</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #0f0f0f;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 412px;
            height: 100vh;
            background: #181818;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        .header {
            text-align: center;
            padding: 15px 0;
            border-bottom: 1px solid #333;
        }

        .header h1 {
            color: #ff0000;
            font-size: 20px;
            letter-spacing: 2px;
        }

        .video-box {
            width: 100%;
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            margin: 20px 0;
            position: relative;
        }

        video {
            width: 100%;
            height: 100%;
            max-height: 300px;
            object-fit: contain;
        }

        .btn-play {
            width: 100%;
            padding: 15px;
            background: #ff0000;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-play:active {
            background: #cc0000;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>DORA DORA STREAMER</h1>
        </div>

        <div class="video-box" id="playerContainer">
            <p style="color: #777; font-size: 14px;">Play button dabayein video chalane ke liye</p>
        </div>

        <button class="btn-play" onclick="startStream()">Play Video 🎬</button>
    </div>

    <script>
        // आपका Render बैकएंड यूआरएल और नई Telegram File ID बिल्कुल सेट है
        const RENDER_BASE_URL = "https://study-material-959y.onrender.com";
        const FILE_ID = "BAACAgUAAxkBAAEDFFtqoWvOgt-Y4JKlcQqTxpJwQJzBmQAC1SEAAmEhEFXYVu5O_Oa6Xz0E";

        function startStream() {
            const container = document.getElementById('playerContainer');
            container.innerHTML = '';

            const video = document.createElement('video');
            video.controls = true;
            video.autoplay = true;
            video.playsInline = true;
            video.setAttribute('controlsList', 'nodownload');

            // सीधा स्ट्रीम लिंक जोड़ा गया है
            video.src = `${RENDER_BASE_URL}/stream?file_id=${FILE_ID}`;

            container.appendChild(video);
            
            video.onerror = function() {
                alert('Video load hone mein error aaya hai. Render server ya File ID check karein.');
            };
        }
    </script>
</body>
</html>
